<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <linearGradient id="vhBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003580"/>
      <stop offset="45%" stop-color="#0256b8"/>
      <stop offset="100%" stop-color="#0d82df"/>
    </linearGradient>
    <linearGradient id="vhAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d82df"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Simbolo Izquierdo / Monograma VH con Globo y Carretera -->
  <g transform="translate(10, 10)" filter="url(#subtleDrop)">
    <!-- Silueta VH de fondo estirada -->
    <path d="M 20,20 L 55,20 L 85,115 L 115,20 L 150,20 L 105,145 L 65,145 Z" fill="url(#vhBlueGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 125,25 L 155,25 L 155,75 L 185,75 L 185,25 L 215,25 L 215,145 L 185,145 L 185,100 L 155,100 L 155,145 L 125,145 Z" fill="url(#vhBlueGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

    <!-- Globo Terraqueo con meridianos -->
    <g transform="translate(145, 80)">
      <circle cx="0" cy="0" r="32" fill="#02428f" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Continentes simplificados -->
      <path d="M -18,-10 Q -10,-24 4,-20 Q 15,-18 20,-8 Q 12,5 2,2 Q -10,1 -14,14 Q -22,12 -25,2 Z" fill="#38bdf8" opacity="0.85"/>
      <path d="M -8,10 Q 0,16 8,15 Q 12,25 0,28 Q -10,26 -8,10 Z" fill="#38bdf8" opacity="0.85"/>
      <!-- Meridianos / Paralelos -->
      <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="14" ry="30" fill="none" stroke="#93c5fd" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- Carretera en perspectiva envolvente -->
    <path d="M 40,150 C 90,135 150,125 185,95 C 195,85 185,75 165,75 C 130,75 110,95 100,105 C 80,125 45,145 15,152 Z" fill="url(#roadGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Linea discontinua de la carretera -->
    <path d="M 42,148 C 90,134 145,123 175,95" fill="none" stroke="#facc15" stroke-width="2.5" stroke-dasharray="6,4"/>
  </g>

  <!-- Tipografia Oficial a la Derecha -->
  <g transform="translate(230, 20)">
    <!-- Cinta / Subtitulo TRANSPORTACIONES -->
    <path d="M 0,12 L 290,12 L 275,36 L 0,36 Z" fill="url(#vhAccentGrad)"/>
    <text x="15" y="30" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="3.5">TRANSPORTACIONES</text>

    <!-- Titulo Principal VAZQUEZ -->
    <text x="0" y="82" font-family="'Montserrat', 'Impact', sans-serif" font-weight="900" font-size="44" fill="#0a2558" letter-spacing="1">VAZQUEZ</text>
    
    <!-- Titulo Principal HEREDIA -->
    <text x="0" y="122" font-family="'Montserrat', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#0256b8" letter-spacing="1.5">HEREDIA</text>

    <!-- Sublema o Tagline -->
    <text x="2" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#64748b" letter-spacing="2">LOGÍSTICA • TRANSPORTE • ALMACENAJE</text>
    
    <!-- Detalle de puerto -->
    <rect x="0" y="152" width="280" height="3" fill="url(#vhBlueGrad)" rx="1.5"/>
  </g>
</svg>
